services:
  - type: web
    name: grimuar-mmo-bot
    env: node
    plan: free
    buildCommand: npm config set prefix /tmp/npm && npm install -g pnpm@10.26.1 && /tmp/npm/bin/pnpm install --frozen-lockfile && /tmp/npm/bin/pnpm --filter @workspace/db run push && /tmp/npm/bin/pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
